name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm when NPM_TOKEN is configured."
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:local
      - run: npm run benchmark:packets
      - run: npm run eval
      - run: npm run study
      - run: npm pack --dry-run
      - name: Publish to npm
        if: ${{ env.NODE_AUTH_TOKEN != '' && (github.event_name != 'workflow_dispatch' || inputs.publish == true) }}
        run: npm publish --access public
      - name: Skip npm publish
        if: ${{ env.NODE_AUTH_TOKEN == '' || (github.event_name == 'workflow_dispatch' && inputs.publish != true) }}
        run: echo "npm publish was skipped for this run."
